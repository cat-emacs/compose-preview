// Collects everything Android Studio's Compose preview renderer needs for one
// Android module and writes it as JSON for the Emacs side to consume.
//
// Nothing is injected into the project: no generated sources, no extra test
// plugins, no build file rewriting. The task only reads variant artifacts and
// resolves the layoutlib data plus the standalone renderer from Maven, exactly
// like AGP's own Compose screenshot support does.

import com.android.tools.preview.multipreview.PreviewMethodFinder
import groovy.json.JsonOutput
import org.gradle.api.DefaultTask
import org.gradle.api.attributes.Attribute
import org.gradle.api.file.ConfigurableFileCollection
import org.gradle.api.file.Directory
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.file.RegularFile
import org.gradle.api.file.RegularFileProperty
import org.gradle.api.provider.ListProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.InputFiles
import org.gradle.api.tasks.Internal
import org.gradle.api.tasks.Optional
import org.gradle.api.tasks.OutputFile
import org.gradle.api.tasks.TaskAction
import org.objectweb.asm.ClassReader
import org.objectweb.asm.tree.ClassNode

import java.lang.reflect.InvocationHandler
import java.lang.reflect.Method
import java.lang.reflect.Proxy
import java.nio.file.Files
import java.nio.file.Path
import java.nio.file.StandardCopyOption
import java.util.zip.ZipFile
import java.util.zip.ZipInputStream

def layoutlibVersion = System.getenv("COMPOSE_PREVIEW_LAYOUTLIB_VERSION") ?: "16.1.0-jdk17"
def rendererVersion = System.getenv("COMPOSE_PREVIEW_RENDERER_VERSION") ?: "0.0.1-alpha16"
def targetModulePath = System.getenv("COMPOSE_PREVIEW_MODULE_PATH")
def targetVariant = System.getenv("COMPOSE_PREVIEW_VARIANT") ?: "debug"
def modelFilePath = System.getenv("COMPOSE_PREVIEW_MODEL_FILE")

initscript {
    def version = System.getenv("COMPOSE_PREVIEW_DETECTOR_VERSION") ?: "32.5.0-alpha05"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.compose:compose-preview-detector:${version}"
    }
}

abstract class ComposePreviewModelTask extends DefaultTask {

    @InputFiles
    abstract ListProperty<RegularFile> getAllJars()

    @InputFiles
    abstract ListProperty<Directory> getAllDirs()

    @InputFiles
    abstract ListProperty<RegularFile> getProjectJars()

    @InputFiles
    abstract ListProperty<Directory> getProjectDirs()

    @InputFiles
    abstract ConfigurableFileCollection getDependencyClasses()

    @InputFiles
    abstract ConfigurableFileCollection getDependencyRClasses()

    @InputFiles
    @Optional
    abstract ConfigurableFileCollection getAggregatedRClassJar()

    @InputFiles
    abstract ConfigurableFileCollection getLayoutlibRuntimeJar()

    @InputFiles
    abstract ConfigurableFileCollection getLayoutlibResourcesJar()

    @InputFiles
    abstract ConfigurableFileCollection getRendererClasspath()

    @InputFiles
    @Optional
    abstract ConfigurableFileCollection getResourceApkCandidates()

    @Input
    abstract Property<String> getNamespace()

    @Input
    abstract Property<String> getModulePath()

    @Input
    abstract Property<String> getProjectRootPath()

    @Input
    abstract Property<String> getModuleRootPath()

    @Input
    abstract Property<String> getVariantName()

    @Internal
    abstract DirectoryProperty getLayoutlibDataDir()

    @OutputFile
    abstract RegularFileProperty getModelFile()

    @TaskAction
    void writeModel() {
        def layoutlibDir = prepareLayoutlibData()
        def projectDirFiles = projectDirs.get().collect { it.asFile }
        def projectJarFiles = projectJars.get().collect { it.asFile }
        def scopedFiles = allDirs.get().collect { it.asFile } + allJars.get().collect { it.asFile }
        def aggregatedRJars = aggregatedRClassJar.files.findAll {
            it.name == "R.jar" && it.exists()
        }
        // Match AGP's Compose Preview runfiles: the linked R jar belongs to the
        // project classpath, ahead of module classes, while dependency classes
        // come only from the runtime configuration.
        def projectClassPath = (aggregatedRJars + projectDirFiles + projectJarFiles)
                .findAll { it.exists() }
        def allRClassJars = new LinkedHashSet(
                dependencyRClasses.files.toList() + aggregatedRJars)
                .findAll { it.exists() }
                .toList()
        def rClassJars = aggregatedRJars ?: allRClassJars
        def dependencyJars = new LinkedHashSet(
                scopedFiles + dependencyClasses.files.toList())
                .findAll {
                    it.exists() &&
                            !projectClassPath.contains(it) &&
                            !allRClassJars.contains(it)
                }
                .toList()

        // The finder scans its first two arguments; the rest only resolve
        // multipreview annotations, so the module classes act as both.
        def finder = new PreviewMethodFinder(projectDirFiles, projectJarFiles,
                projectDirFiles, projectJarFiles, dependencyJars)
        // ASM reports class values as type descriptors, e.g. Lcom/foo/Bar;
        def className = { Object value ->
            def text = String.valueOf(value)
            (text.startsWith("L") && text.endsWith(";"))
                    ? text.substring(1, text.length() - 1).replace('/', '.')
                    : text
        }
        def sourceFileForMethod = { String methodFqn ->
            def owner = methodFqn.substring(0, methodFqn.lastIndexOf('.'))
            def entryName = owner.replace('.', '/') + ".class"
            byte[] bytes = null
            for (File directory : projectDirFiles) {
                def classFile = new File(directory, entryName)
                if (classFile.isFile()) {
                    bytes = classFile.bytes
                    break
                }
            }
            if (bytes == null) {
                for (File jar : projectJarFiles) {
                    if (!jar.isFile()) {
                        continue
                    }
                    new ZipFile(jar).withCloseable { zip ->
                        def entry = zip.getEntry(entryName)
                        if (entry != null) {
                            bytes = zip.getInputStream(entry).withCloseable { it.bytes }
                        }
                    }
                    if (bytes != null) {
                        break
                    }
                }
            }
            if (bytes == null) {
                return null
            }
            def node = new ClassNode()
            new ClassReader(bytes).accept(node,
                    ClassReader.SKIP_CODE | ClassReader.SKIP_FRAMES)
            return node.sourceFile
        }
        def previews = finder.findAllPreviewMethods().collect { preview ->
            [
                    methodFQN      : preview.method.methodFqn,
                    sourceFile     : sourceFileForMethod(preview.method.methodFqn),
                    previewWrapperFQN: preview.method.previewWrapperFqn,
                    // One entry per @PreviewParameter parameter, carrying that
                    // annotation's attributes (provider, limit). The renderer
                    // expands the provider values itself, and expects the
                    // provider as a class name rather than a type descriptor.
                    methodParams   : preview.method.parameters.collect { parameter ->
                        parameter.annotationParameters.collectEntries { key, value ->
                            [(key.toString()): className(value)]
                        }
                    },
                    annotations    : preview.previewAnnotations.collect { annotation ->
                        annotation.parameters.collectEntries { key, value ->
                            [(key.toString()): String.valueOf(value)]
                        }
                    }
            ]
        }.sort { it.methodFQN }

        def resourceApk = resourceApkCandidates.files.find { it.name.endsWith(".ap_") } ?:
                resourceApkCandidates.files.find { it.name.endsWith(".apk") }
        def fontsDir = new File(layoutlibDir, "data/fonts")

        def model = [
                projectRoot     : projectRootPath.get(),
                moduleRoot      : moduleRootPath.get(),
                modulePath      : modulePath.get(),
                variant         : variantName.get(),
                namespace       : namespace.get(),
                javaExecutable  : new File(System.getProperty("java.home"), "bin/java").absolutePath,
                layoutlibPath   : layoutlibDir.absolutePath,
                fontsPath       : fontsDir.isDirectory() ? fontsDir.absolutePath : null,
                resourceApkPath : resourceApk?.absolutePath,
                rendererClassPath: rendererClasspath.files.collect { it.absolutePath }.sort(),
                classPath       : (projectClassPath + dependencyJars).collect { it.absolutePath },
                projectClassPath: projectClassPath.collect { it.absolutePath },
                // Passed to the renderer as rClassJars. Without these the
                // renderer registers no resource packages, every library R id
                // resolves to 0, and previews render blank.
                rClassJars      : rClassJars.collect { it.absolutePath },
                previews        : previews,
        ]

        def output = modelFile.get().asFile
        output.parentFile.mkdirs()
        output.text = JsonOutput.prettyPrint(JsonOutput.toJson(model))
        logger.lifecycle("compose-preview: wrote ${previews.size()} preview declarations to ${output}")
        if (resourceApk == null) {
            logger.warn("compose-preview: no resource apk found for ${modulePath.get()}; rendering will fail")
        }
    }

    // Mirrors AGP's layoutlib extraction: unpack layoutlib-runtime and drop the
    // framework resources jar in as data/framework_res.jar.
    private File prepareLayoutlibData() {
        def target = layoutlibDataDir.get().asFile
        def runtimeJar = layoutlibRuntimeJar.files.find { it.name.endsWith(".jar") }
        def resourcesJar = layoutlibResourcesJar.files.find { it.name.endsWith(".jar") }
        if (runtimeJar == null) {
            throw new IllegalStateException("Could not resolve the layoutlib runtime jar")
        }
        if (resourcesJar == null) {
            throw new IllegalStateException("Could not resolve the layoutlib resources jar")
        }

        def stamp = new File(target, ".compose-preview-stamp")
        def expected = "${runtimeJar.name}:${runtimeJar.length()}:${resourcesJar.name}:${resourcesJar.length()}"
        if (stamp.isFile() && stamp.text == expected) {
            return target
        }

        target.deleteDir()
        Path root = target.toPath()
        Files.createDirectories(root)
        def safeEntryName = { String name ->
            !name.contains(":") &&
                    !name.tokenize("/\\").contains("..") &&
                    name.toCharArray().every { (it as int) >= 32 }
        }
        runtimeJar.withInputStream { rawStream ->
            new ZipInputStream(rawStream).withCloseable { zip ->
                def entry
                while ((entry = zip.nextEntry) != null) {
                    if (entry.directory || !safeEntryName(entry.name)) {
                        continue
                    }
                    Path destination = root.resolve(entry.name).normalize()
                    if (!destination.startsWith(root)) {
                        continue
                    }
                    Files.createDirectories(destination.parent)
                    Files.copy(zip, destination, StandardCopyOption.REPLACE_EXISTING)
                }
            }
        }
        Path frameworkRes = root.resolve("data").resolve("framework_res.jar")
        Files.createDirectories(frameworkRes.parent)
        Files.copy(resourcesJar.toPath(), frameworkRes, StandardCopyOption.REPLACE_EXISTING)
        stamp.text = expected
        return target
    }
}

// Adapts a Groovy closure to kotlin.jvm.functions.Function1 as loaded by AGP's
// own classloader, so no AGP artifact has to be on the init script classpath.
static Object asFunction1(ClassLoader loader, Closure body) {
    def function1Class = loader.loadClass("kotlin.jvm.functions.Function1")
    def handler = { Object proxy, Method method, Object[] args ->
        switch (method.name) {
            case "invoke":
                return body.call(args[0])
            case "equals":
                return proxy.is(args[0])
            case "hashCode":
                return System.identityHashCode(proxy)
            case "toString":
                return "compose-preview Function1"
            default:
                return null
        }
    } as InvocationHandler
    return Proxy.newProxyInstance(loader, [function1Class] as Class[], handler)
}

// variant.artifacts.forScope(SCOPE).use(task).toGet(CLASSES, jars, dirs)
static void wireScopedClasses(Object variant, Object taskProvider, String scopeName,
                              Closure jarsGetter, Closure dirsGetter) {
    def loader = variant.getClass().getClassLoader()
    def scope = Enum.valueOf(
            loader.loadClass('com.android.build.api.variant.ScopedArtifacts$Scope'), scopeName)
    def classesArtifact = loader
            .loadClass('com.android.build.api.artifact.ScopedArtifact$CLASSES')
            .getField("INSTANCE")
            .get(null)
    def operation = variant.artifacts.forScope(scope).use(taskProvider)
    def toGet = operation.getClass().getMethods().find { it.name == "toGet" }
    toGet.invoke(operation, classesArtifact,
            asFunction1(loader, jarsGetter),
            asFunction1(loader, dirsGetter))
}

static Object dependencyClassesFromConfiguration(Object configuration, String artifactType) {
    return configuration.incoming.artifactView { view ->
        view.lenient(true)
        view.attributes {
            it.attribute(Attribute.of("artifactType", String), artifactType)
        }
    }.files
}

static Object dependencyClassesView(Object project, String configurationName, String artifactType) {
    return project.provider {
        def configuration = project.configurations.findByName(configurationName)
        if (configuration == null) {
            return project.files()
        }
        return configuration.incoming.artifactView { view ->
            view.lenient(true)
            view.attributes {
                it.attribute(Attribute.of("artifactType", String), artifactType)
            }
        }.files
    }
}

if (targetModulePath == null || modelFilePath == null) {
    return
}

def variantSuffix = targetVariant.substring(0, 1).toUpperCase(Locale.ROOT) + targetVariant.substring(1)

gradle.ext.composePreviewTargetModulePath = targetModulePath
gradle.ext.composePreviewTargetVariant = targetVariant
gradle.ext.composePreviewRegisterKmp = { project, variant, resourceApk, runtimeRJar ->
    def layoutlibRuntime = project.configurations.detachedConfiguration(
            project.dependencies.create("com.android.tools.layoutlib:layoutlib-runtime:${layoutlibVersion}"))
    def layoutlibResources = project.configurations.detachedConfiguration(
            project.dependencies.create("com.android.tools.layoutlib:layoutlib-resources:${layoutlibVersion}"))
    def renderer = project.configurations.detachedConfiguration(
            project.dependencies.create("com.android.tools.layoutlib:layoutlib:${layoutlibVersion}"),
            project.dependencies.create("com.android.tools.compose:compose-preview-renderer:${rendererVersion}"))
    [layoutlibRuntime, layoutlibResources, renderer].each { it.transitive = true }
    def provider = project.tasks.register("composePreviewModel", ComposePreviewModelTask) { task ->
        task.group = "compose preview"
        task.description = "Collects Android KMP Compose preview metadata for Emacs"
        task.namespace.set(variant.namespace)
        task.modulePath.set(targetModulePath)
        task.projectRootPath.set(project.rootDir.absolutePath)
        task.moduleRootPath.set(project.projectDir.absolutePath)
        task.variantName.set(targetVariant)
        task.modelFile.set(new File(modelFilePath))
        task.layoutlibDataDir.set(
                project.layout.buildDirectory.dir("compose-preview/layoutlib-${layoutlibVersion}"))
        task.layoutlibRuntimeJar.from(layoutlibRuntime)
        task.layoutlibResourcesJar.from(layoutlibResources)
        task.rendererClasspath.from(renderer)
        task.allJars.set([])
        task.allDirs.set([])
        [variant.runtimeConfiguration].each { configuration ->
            ["android-classes-jar", "jar", "processed-jar"].each { artifactType ->
                task.dependencyClasses.from(
                        dependencyClassesFromConfiguration(configuration, artifactType))
            }
            task.dependencyRClasses.from(
                    dependencyClassesFromConfiguration(configuration, "r-class-jar"))
        }
        task.resourceApkCandidates.from(resourceApk)
        task.aggregatedRClassJar.from(runtimeRJar)
    }
    wireScopedClasses(variant, provider, "PROJECT", { it.projectJars }, { it.projectDirs })
}

def adapterDirectory = System.getenv("COMPOSE_PREVIEW_ADAPTER_DIRECTORY")
if (adapterDirectory == null) {
    throw new GradleException("compose-preview: COMPOSE_PREVIEW_ADAPTER_DIRECTORY is required")
}
apply from: new File(adapterDirectory, "agp-9.3-kmp.init.gradle")

gradle.beforeProject { project ->
    if (project.path != targetModulePath) {
        return
    }
    ["com.android.application", "com.android.library", "com.android.dynamic-feature"].each { pluginId ->
        project.plugins.withId(pluginId) {
            // AGP only links a resource apk for a local test component when
            // Android resources are requested, and that apk is what layoutlib
            // resolves resources against.
            def android = project.extensions.findByName("android")
            if (android != null) {
                android.testOptions.unitTests.includeAndroidResources = true
            }

            def androidComponents = project.extensions.findByName("androidComponents")
            if (androidComponents == null) {
                return
            }

            def layoutlibRuntime = project.configurations.detachedConfiguration(
                    project.dependencies.create("com.android.tools.layoutlib:layoutlib-runtime:${layoutlibVersion}"))
            def layoutlibResources = project.configurations.detachedConfiguration(
                    project.dependencies.create("com.android.tools.layoutlib:layoutlib-resources:${layoutlibVersion}"))
            def renderer = project.configurations.detachedConfiguration(
                    project.dependencies.create("com.android.tools.layoutlib:layoutlib:${layoutlibVersion}"),
                    project.dependencies.create("com.android.tools.compose:compose-preview-renderer:${rendererVersion}"))
            [layoutlibRuntime, layoutlibResources, renderer].each { it.transitive = true }

            androidComponents.onVariants(androidComponents.selector().withName(targetVariant)) { variant ->
                def provider = project.tasks.register("composePreviewModel", ComposePreviewModelTask) { task ->
                    task.group = "compose preview"
                    task.description = "Collects Compose preview metadata for Emacs"
                    task.namespace.set(variant.namespace)
                    task.modulePath.set(targetModulePath)
                    task.projectRootPath.set(project.rootDir.absolutePath)
                    task.moduleRootPath.set(project.projectDir.absolutePath)
                    task.variantName.set(targetVariant)
                    task.modelFile.set(new File(modelFilePath))
                    task.layoutlibDataDir.set(
                            project.layout.buildDirectory.dir("compose-preview/layoutlib-${layoutlibVersion}"))
                    task.layoutlibRuntimeJar.from(layoutlibRuntime)
                    task.layoutlibResourcesJar.from(layoutlibResources)
                    task.rendererClasspath.from(renderer)
                    // Match AGP's Compose Preview runfiles task: only the
                    // runtime configuration contributes dependency classes.
                    task.dependencyClasses.from(
                            dependencyClassesView(project,
                                    "${targetVariant}RuntimeClasspath", "android-classes-jar"))
                    task.dependencyRClasses.from(
                            dependencyClassesView(project,
                                    "${targetVariant}RuntimeClasspath", "r-class-jar"))

                    def resourceApkTask = "package${variantSuffix}UnitTestForUnitTest"
                    if (project.tasks.names.contains(resourceApkTask)) {
                        task.resourceApkCandidates.from(project.tasks.named(resourceApkTask))
                    } else {
                        task.logger.warn("compose-preview: ${resourceApkTask} is not available in ${project.path}")
                    }

                    def rClassTask = "process${variantSuffix}UnitTestResources"
                    if (project.tasks.names.contains(rClassTask)) {
                        task.aggregatedRClassJar.from(project.tasks.named(rClassTask))
                    }
                }

                wireScopedClasses(variant, provider, "ALL", { it.allJars }, { it.allDirs })
                wireScopedClasses(variant, provider, "PROJECT", { it.projectJars }, { it.projectDirs })
            }
        }
    }
}
