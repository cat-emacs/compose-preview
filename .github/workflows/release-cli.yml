name: Release CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: CLI version declared in gradle.properties
        required: true
        default: '0.1.1'
        type: string

permissions:
  contents: read

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$(awk -F= '$1 == "cliVersion" {print $2}' gradle.properties)" = "$VERSION"
          [[ "$VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
      - name: Test and build distribution
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :cli:test :cli:distZip :cli:distTar --console=plain
      - name: Checksums
        working-directory: cli/build/distributions
        run: sha256sum *.zip *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cli-distribution
          path: cli/build/distributions/
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: cli-distribution
          path: artifacts
      - name: Verify checksums and unpack without source checkout
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd artifacts
          if command -v sha256sum >/dev/null; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
          if [ "$RUNNER_OS" = Windows ]; then unzip -q "compose-preview-$VERSION.zip" -d ../installed; else mkdir ../installed; tar -xzf "compose-preview-$VERSION.tar.gz" -C ../installed; fi
      - name: Unix launcher smoke
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          CLI="$GITHUB_WORKSPACE/installed/compose-preview-$VERSION/bin/compose-preview"
          cd "$RUNNER_TEMP"
          "$CLI" --help
          "$CLI" doctor --json > doctor.json
          python3 -c 'import json; d=json.load(open("doctor.json")); assert d["schemaVersion"] == 1 and d["status"] == "ready"'
      - name: Windows launcher smoke
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $cli = "$env:GITHUB_WORKSPACE/installed/compose-preview-$env:VERSION/bin/compose-preview.bat"
          Set-Location $env:RUNNER_TEMP
          & $cli --help
          if ($LASTEXITCODE -ne 0) { throw "Help failed" }
          $result = & $cli doctor --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $result.schemaVersion -ne 1 -or $result.status -ne 'ready') { throw "Doctor failed" }

  publish:
    needs: smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cli-distribution
          path: artifacts
      - name: Tag source and publish immutable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$VERSION" -m "compose-preview CLI $VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --verify-tag --draft --title "compose-preview $VERSION" \
            --notes "Portable JVM CLI for macOS, Linux and Windows. Requires JDK 17+. Runtime dependencies are bundled; no Kotlin compiler or GitHub Packages credentials are needed. Platform smoke tests cover launchers and doctor, not full Android rendering. Verify downloads against SHA256SUMS." \
            artifacts/*.zip artifacts/*.tar.gz artifacts/SHA256SUMS
          gh release edit "v$VERSION" --draft=false
