name: CI

on:
  push:
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :cli:test :cli:installDist
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Installed CLI smoke outside checkout
        run: |
          CLI="$PWD/cli/build/install/compose-preview/bin/compose-preview"
          cd /tmp
          "$CLI" --help
          "$CLI" doctor --json
          test ! -e "$(dirname "$CLI")/../gradle/project.init.gradle"
          test -f "$(dirname "$CLI")/../lib/android-project-core-0.1.4.jar"
          ! command -v android-project
  emacs:
    uses: cat-emacs/.github/.github/workflows/emacs-package.yml@v1
    with:
      install-command: make install-deps
      check-command: make lint build test
